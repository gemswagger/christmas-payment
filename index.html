<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Request - Merry Christmas</title>
<style>
  :root { --green:#1b7a3d; --green-dark:#125a2c; --red:#c62828; --red-dark:#9b1c1c; --bg:#ffe9e9; --card:#ffffff; --text:#2b2b2b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:16px; }
  .wrap { max-width:440px; margin:0 auto; }
  .meme { width:100%; display:block; border-radius:16px; border:3px solid var(--green); margin-bottom:14px; background:#fff; }
  .banner { text-align:center; background:var(--green); color:#fff; padding:14px 12px; border-radius:16px 16px 0 0; font-size:1.5rem; font-weight:800; letter-spacing:.5px; border-bottom:4px solid var(--red); }
  .banner span { color:#ffd6d6; }
  .card { background:var(--card); border-radius:0 0 16px 16px; padding:20px 18px 24px; box-shadow:0 6px 18px rgba(198,40,40,.18); }
  .label { text-align:center; font-size:.8rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--green); font-weight:700; }
  .total { text-align:center; font-size:2.6rem; font-weight:900; color:var(--red); margin:4px 0 16px; }
  h2 { font-size:.95rem; color:var(--green-dark); border-bottom:2px solid var(--green); padding-bottom:6px; margin-bottom:8px; }
  .row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed #e3b5b5; font-size:1rem; }
  .row .amt { font-weight:700; color:var(--green-dark); }
  .row.total-row { border-bottom:none; border-top:2px solid var(--red); margin-top:4px; font-weight:800; color:var(--red); }
  .row.total-row .amt { color:var(--red); }
  .deadline { margin:18px 0; text-align:center; background:#fff3f3; border:2px solid var(--red); color:var(--red-dark); border-radius:12px; padding:10px; font-weight:700; }
  .qr-box { text-align:center; border:3px solid var(--green); border-radius:16px; padding:10px; background:#f2fbf4; }
  .qr-box p { color:var(--green-dark); font-weight:700; margin-bottom:8px; }
  .qr-box img { width:100%; max-width:320px; border-radius:12px; }
  .instruction { margin-top:18px; background:var(--green); color:#fff; border-radius:12px; padding:14px; text-align:center; font-size:.95rem; line-height:1.4; }
  .instruction b { color:#ffd6d6; }
  .footer { text-align:center; margin-top:16px; font-size:1.15rem; font-weight:800; color:var(--red); }
  .footer .g { color:var(--green); }
</style>
</head>
